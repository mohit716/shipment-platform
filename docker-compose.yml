# Full local stack: database, broker, API, worker, scheduler, dashboard.
name: fleetline

x-app-environment: &app-environment
  APP_NAME: FleetLine
  ENVIRONMENT: development
  DEBUG: "false"
  DATABASE_URL: postgresql+asyncpg://fleetline:fleetline@db:5432/fleetline
  DATABASE_ECHO: "false"
  SECRET_KEY: compose-secret-change-me-not-for-production
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  BCRYPT_ROUNDS: "12"
  EMAIL_BACKEND: console
  CELERY_ENABLED: "true"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  FRONTEND_URL: http://localhost:8080
  TRUST_PROXY_HEADERS: "true"
  CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'

services:
  db:
    image: postgres:17-alpine
    container_name: fleetline-db
    environment:
      POSTGRES_USER: fleetline
      POSTGRES_PASSWORD: fleetline
      POSTGRES_DB: fleetline
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetline -d fleetline"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: fleetline-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: fleetline-api
    environment:
      <<: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: fleetline-worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      <<: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    container_name: fleetline-beat
    command: celery -A app.worker.celery_app beat --loglevel=info
    environment:
      <<: *app-environment
    depends_on:
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: fleetline-web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
