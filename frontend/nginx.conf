server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # JSON API, proxied so the browser stays same-origin inside Compose.
    location ~ ^/(auth|users|shipments|warehouses|tags|health|docs|redoc|openapi.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: a client-side route like /shipments/3 is not a file.
    location / {
        try_files $uri /index.html;
    }
}
